name: Build VirtualApp APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GRADLE_OPTS: "-Xmx4096m --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: va

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Delete local.properties
      run: rm -f local.properties

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle2-

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Find APKs
      if: always()
      run: |
        echo "=== All APKs ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "None found"
        echo "=== Output tree ==="
        ls -laR app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apk
        path: '**/*.apk'
        retention-days: 30
