name: Build VirtualApp APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GRADLE_OPTS: "-Xmx4096m --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: va

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Delete local.properties
      run: rm -f local.properties

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-

    - name: Build debug APK (aosp)
      run: ./gradlew assembleAospDebug --no-daemon --stacktrace 2>&1 | tail -80

    - name: Build release APK (fdroid)
      run: ./gradlew assembleFdroidRelease --no-daemon --stacktrace 2>&1 | tail -80

    - name: Upload aosp debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: aosp-debug-apk
        path: app/build/outputs/apk/aosp/debug/*.apk
        retention-days: 30

    - name: Upload fdroid release APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fdroid-release-apk
        path: app/build/outputs/apk/fdroid/release/*.apk
        retention-days: 30
