name: Build VirtualApp APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: va

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 10406996
        packages: 'platforms;android-30 build-tools;30.0.0 ndk;21.4.7075529'

    - name: Delete local.properties
      run: rm -f local.properties

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Find APKs
      if: always()
      run: |
        echo "=== All APKs ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "None found"
        echo "=== Output tree ==="
        ls -laR app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apk
        path: '**/*.apk'
        retention-days: 30
