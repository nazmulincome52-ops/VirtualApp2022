name: Build VirtualApp APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: va

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Install Android SDK & NDK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT/cmdline-tools
        curl -sL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
        unzip -q tools.zip
        mv cmdline-tools latest
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true
        sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-30" "build-tools;30.0.0" "ndk;21.4.7075529"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

    - name: Delete local.properties
      run: rm -f local.properties

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Find APKs
      if: always()
      run: |
        echo "=== All APKs ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "None found"
        echo "=== Output tree ==="
        ls -laR app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apk
        path: '**/*.apk'
        retention-days: 30
