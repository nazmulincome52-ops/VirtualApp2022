name: Build APK

on:
  push:
    branches: [ va, master, main ]
  pull_request:
    branches: [ va, master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: nazmulincome52-ops/VirtualApp2022
        ref: va

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Android SDK (manual)
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        # Download cmdline-tools v8 (compatible with JDK 8)
        curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools latest
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "tools" "platform-tools" "build-tools;30.0.0" "platforms;android-30"

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Delete local.properties
      run: rm -f local.properties

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build debug APK (aosp flavor)
      run: ./gradlew assembleAospDebug --no-daemon --stacktrace
      env:
        GRADLE_OPTS: "-Xmx4096m -Dorg.gradle.jvmargs=-Xmx4096m"
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Build release APK (fdroid flavor)
      run: ./gradlew assembleFdroidRelease --no-daemon --stacktrace
      env:
        GRADLE_OPTS: "-Xmx4096m -Dorg.gradle.jvmargs=-Xmx4096m"
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Upload aosp debug APK
      uses: actions/upload-artifact@v4
      with:
        name: aosp-debug-apk
        path: app/build/outputs/apk/aosp/debug/*.apk
        retention-days: 30

    - name: Upload fdroid release APK
      uses: actions/upload-artifact@v4
      with:
        name: fdroid-release-apk
        path: app/build/outputs/apk/fdroid/release/*.apk
        retention-days: 30

    - name: Upload all APKs
      uses: actions/upload-artifact@v4
      with:
        name: all-apks
        path: app/build/outputs/apk/**/*.apk
        retention-days: 30
